<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pedido confirmado | AURINEGRA</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #11100f;
      color: #f5f5f5;
      display: grid;
      place-items: center;
      min-height: 100vh;
      text-align: center;
    }
    .box {
      max-width: 520px;
      padding: 40px;
      border: 1px solid #c8a96a;
      border-radius: 24px;
    }
    h1 { color: #c8a96a; }
    a {
      display: inline-block;
      margin-top: 20px;
      background: #c8a96a;
      color: #000;
      padding: 12px 22px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Pedido confirmado</h1>
    <p>Gracias por tu compra en AURINEGRA.</p>
    <p>Hemos recibido tu pedido correctamente.</p>
    <p id="numero-pedido" hidden>Tu número de pedido: <strong></strong></p>
    <p>Te enviaremos la factura por email y te avisaremos cuando tu pedido salga hacia tu dirección.</p>
    <a href="index.html">Volver al inicio</a>
  </div>

  <script>
    try { localStorage.removeItem("carrito"); } catch (e) {}

    // Número de pedido que pasa el servidor en la URL (?pedido=PED-2026-0001)
    const numero = new URLSearchParams(location.search).get("pedido");
    if (numero && /^PED-\d{4}-\d{4,}$/.test(numero)) {
      const p = document.getElementById("numero-pedido");
      p.querySelector("strong").textContent = numero;
      p.hidden = false;
    }
  </script>
</body>
</html>
